<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Curso — Sistema Acadêmico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(90deg, rgba(14,14,161,1) 36%, rgba(0,212,255,1) 100%);
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            padding: 60px 24px;
        }

        .wrapper {
            background: #fff;
            border: 1.5px solid rgba(0,0,0,0.774);
            max-width: 560px;
            margin: 0 auto;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            animation: fadeUp 0.4s ease both;
            overflow: hidden;
        }

        /* ── Topo ── */
        .header { padding: 32px 32px 28px; }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #aaa;
            text-decoration: none;
            margin-bottom: 24px;
            transition: color 0.2s;
        }
        .back:hover { color: #111; }

        .page-eyebrow {
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 6px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #111;
            margin-bottom: 4px;
        }

        /* badge de id */
        .id-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.05em;
            background: #eef0ff;
            color: #0e0ea1;
            padding: 3px 9px;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .page-sub { font-size: 13px; color: #aaa; }

        /* ── Divider ── */
        .divider { border: none; border-top: 1px solid #e8e8e8; }

        /* ── Formulário ── */
        .form-body { padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; }

        .field { display: flex; flex-direction: column; gap: 6px; }

        label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #888;
        }

        input, select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e8e8e8;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #111;
            background: #fff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none;
        }

        input:focus, select:focus {
            border-color: #0e0ea1;
            box-shadow: 0 0 0 3px rgba(14,14,161,0.08);
        }

        /* select arrow */
        .select-wrap { position: relative; }
        .select-wrap::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 10px;
            color: #aaa;
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        /* campo readonly de id */
        input[readonly] {
            background: #f8f8f8;
            color: #aaa;
            cursor: not-allowed;
        }

        /* ── Zona de perigo ── */
        .danger-zone {
            border: 1px solid #ffe0e0;
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .danger-label { font-size: 12px; color: #c0392b; }
        .danger-label strong { display: block; font-weight: 600; margin-bottom: 2px; }

        .btn-danger {
            padding: 8px 14px;
            background: #fff0f0;
            color: #c0392b;
            border: 1px solid #f5c0c0;
            border-radius: 7px;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }
        .btn-danger:hover { background: #c0392b; color: #fff; }

        /* ── Ações ── */
        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .btn-primary {
            flex: 1;
            padding: 12px;
            background: #0e0ea1;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:hover { background: #0b0b7a; transform: translateY(-1px); }

        .btn-secondary {
            padding: 12px 20px;
            background: #f5f5f5;
            color: #555;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-secondary:hover { background: #e8e8e8; }

        /* ── Footer ── */
        footer {
            border-top: 1px solid #e8e8e8;
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .footer-copy { font-size: 11px; color: #ccc; font-weight: 400; }
        .footer-stack { display: flex; gap: 10px; }
        .footer-stack span { font-size: 11px; color: #ccc; }
        .footer-stack span::before { content: '· '; }

        /* ── Animação ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body { padding: 32px 16px; }
            .header, .form-body, footer { padding-left: 20px; padding-right: 20px; }
            .row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="wrapper">

    <div class="header">
        <a class="back" href="/curso"><i class="fa-solid fa-arrow-left"></i> Cursos</a>
        <p class="page-eyebrow">Sistema Acadêmico</p>
        <span class="id-badge">ID {{id}}</span>
        <h1 class="page-title">{{nome}}</h1>
        <p class="page-sub">Edite os dados do curso abaixo.</p>
    </div>

    <hr class="divider">

    <form action="/curso/alterar" method="post">
        <div class="form-body">

            <!-- id oculto para o DAO saber qual registro atualizar -->
            <input type="hidden" name="id" value="{{id}}">

            <div class="field">
                <label for="nome"><i class="fa-solid fa-book"></i> Nome do Curso</label>
                <input type="text" id="nome" name="nome" value="{{nome}}" required>
            </div>

            <div class="field">
                <label for="site"><i class="fa-solid fa-globe"></i> Site</label>
                <input type="url" id="site" name="site" value="{{site}}">
            </div>

            <div class="row">
                <div class="field">
                    <label for="turno"><i class="fa-solid fa-clock"></i> Turno</label>
                    <div class="select-wrap">
                        <select id="turno" name="turno" required>
                            <option value="noturno"    {{#turnoNoturno}}selected{{/turnoNoturno}}>Noturno</option>
                            <option value="diurno"     {{#turnoDiurno}}selected{{/turnoDiurno}}>Diurno</option>
                            <option value="vespertino" {{#turnoVespertino}}selected{{/turnoVespertino}}>Vespertino</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="duracao"><i class="fa-solid fa-hourglass-half"></i> Duração (horas)</label>
                    <input type="number" id="duracao" name="duracao" value="{{duracao}}" min="1" required>
                </div>
            </div>

            <!-- Zona de perigo -->
            <div class="danger-zone">
                <div class="danger-label">
                    <strong>Excluir Curso</strong>
                    Esta ação é irreversível.
                </div>
                <a class="btn-danger" href="/curso/excluir/{{id}}"
                   onclick="return confirm('Tem certeza que deseja excluir este curso?')">
                    <i class="fa-solid fa-trash"></i> Excluir
                </a>
            </div>

            <div class="form-actions">
                <a class="btn-secondary" href="/curso">
                    <i class="fa-solid fa-xmark"></i> Cancelar
                </a>
                <button class="btn-primary" type="submit">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Alterações
                </button>
            </div>

        </div>
    </form>

    <footer>
        <span class="footer-copy">&copy; 2025</span>
        <div class="footer-stack">
            <span>Javalin 7</span>
            <span>Mustache</span>
            <span>PostgreSQL</span>
        </div>
    </footer>

</div>
</body>
</html>

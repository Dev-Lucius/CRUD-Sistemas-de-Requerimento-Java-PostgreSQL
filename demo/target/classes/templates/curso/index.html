<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos — Sistema Acadêmico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(90deg, rgba(14, 14, 161, 1) 36%, rgba(0, 212, 255, 1) 100%);
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            padding: 60px 24px;
        }

        .wrapper {
            background: #fff;
            border: 1.5px solid rgba(0, 0, 0, 0.774);
            max-width: 620px;
            margin: 0 auto;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            animation: fadeUp 0.4s ease both;
            overflow: hidden;
        }

        /* ── Topo ── */
        .header {
            padding: 32px 32px 0;
            color: #000000;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #aaa;
            text-decoration: none;
            margin-bottom: 24px;
            transition: color 0.2s;
        }

        .back:hover {
            color: #111;
        }

        .page-eyebrow {
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #000000;
            margin-bottom: 6px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #000000;
            margin-bottom: 4px;
        }

        .page-sub {
            font-size: 13px;
            color: #000000;
            margin-bottom: 28px;
        }

        /* ── Botão adicionar ── */
        .btn-add {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #0e0ea1;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 8px;
            margin-bottom: 28px;
            transition: background 0.2s, transform 0.2s;
        }

        .btn-add:hover {
            background: #0b0b7a;
            transform: translateY(-1px);
        }

        /* ── Divider ── */
        .divider {
            border: none;
            border-top: 1px solid #e8e8e8;
        }

        /* ── Lista ── */
        .list {
            padding: 0 32px;
        }

        .curso-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .curso-item:last-child {
            border-bottom: none;
        }

        .curso-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .curso-icon {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 14px;
            flex-shrink: 0;
        }

        .curso-nome {
            font-size: 14px;
            font-weight: 500;
            color: #111;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .curso-meta {
            display: flex;
            gap: 8px;
            margin-top: 3px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 4px;
            background: #f0f0f0;
            color: #666;
        }

        .badge.turno {
            background: #eef0ff;
            color: #0e0ea1;
        }

        .badge.duracao {
            background: #fff4e6;
            color: #c05c00;
        }

        /* ── Ações ── */
        .curso-acoes {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-icon {
            width: 34px;
            height: 34px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-edit {
            background: #f0f4ff;
            color: #0e0ea1;
        }

        .btn-edit:hover {
            background: #0e0ea1;
            color: #fff;
        }

        .btn-delete {
            background: #fff0f0;
            color: #c0392b;
        }

        .btn-delete:hover {
            background: #c0392b;
            color: #fff;
        }

        /* ── Empty state ── */
        .empty {
            padding: 48px 32px;
            text-align: center;
            color: #bbb;
            font-size: 14px;
        }

        .empty i {
            font-size: 32px;
            margin-bottom: 12px;
            display: block;
        }

        /* ── Footer ── */
        footer {
            border-top: 1px solid #e8e8e8;
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .footer-copy {
            font-size: 11px;
            color: #ccc;
            font-weight: 400;
        }

        .footer-stack {
            display: flex;
            gap: 10px;
        }

        .footer-stack span {
            font-size: 11px;
            color: #ccc;
        }

        .footer-stack span::before {
            content: '· ';
        }

        /* ── Animação ── */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 32px 16px;
            }

            .header,
            .list {
                padding-left: 20px;
                padding-right: 20px;
            }

            footer {
                padding-left: 20px;
                padding-right: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">

        <div class="header">
            <a class="back" href="/"><i class="fa-solid fa-arrow-left"></i> Início</a>
            <p class="page-eyebrow">Sistema Acadêmico</p>
            <h1 class="page-title">Cursos</h1>
            <p class="page-sub">Gerencie os cursos cadastrados no sistema.</p>
            <a class="btn-add" href="/curso/tela_adicionar">
                <i class="fa-solid fa-plus"></i> Novo Curso
            </a>
        </div>

        <hr class="divider">

        <div class="list">
            {{#vetCurso}}
            <div class="curso-item">
                <div class="curso-left">
                    <div class="curso-icon">
                        <i class="fa-solid fa-book"></i>
                    </div>
                    <div>
                        <p class="curso-nome">{{nome}}</p>
                        <div class="curso-meta">
                            <span class="badge turno">{{turno}}</span>
                            <span class="badge duracao">{{duracao}}h</span>
                            <span class="badge">ID {{id}}</span>
                        </div>
                    </div>
                </div>
                <div class="curso-acoes">
                    <a class="btn-icon btn-edit" href="/curso/tela_alterar/{{id}}" title="Editar">
                        <i class="fa-solid fa-pen"></i>
                    </a>
                    <form action="/curso/excluir/{{id}}" method="post" style="display:inline;">
                        <button class="btn-icon btn-delete" title="Excluir"
                            onclick="return confirm('Excluir o curso {{nome}}?')">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </form>
                </div>
            </div>
            {{/vetCurso}}

            {{^vetCurso}}
            <div class="empty">
                <i class="fa-solid fa-book-open"></i>
                Nenhum curso cadastrado ainda.
            </div>
            {{/vetCurso}}
        </div>

        <footer>
            <span class="footer-copy">&copy; 2025</span>
            <div class="footer-stack">
                <span>Javalin 7</span>
                <span>Mustache</span>
                <span>PostgreSQL</span>
            </div>
        </footer>

    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Curso — Sistema Acadêmico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(90deg, rgba(14,14,161,1) 36%, rgba(0,212,255,1) 100%);
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            padding: 60px 24px;
        }

        .wrapper {
            background: #fff;
            border: 1.5px solid rgba(0,0,0,0.774);
            max-width: 560px;
            margin: 0 auto;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            animation: fadeUp 0.4s ease both;
            overflow: hidden;
        }

        /* ── Topo ── */
        .header { padding: 32px 32px 28px; }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #000000;
            text-decoration: none;
            margin-bottom: 24px;
            transition: color 0.2s;
        }
        .back:hover { color: #111; }

        .page-eyebrow {
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #000000;
            margin-bottom: 6px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #000000;
            margin-bottom: 4px;
        }

        .page-sub {
            font-size: 13px;
            color: #000000;
        }

        /* ── Divider ── */
        .divider { border: none; border-top: 1px solid #e8e8e8; }

        /* ── Formulário ── */
        .form-body { padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; }

        .field { display: flex; flex-direction: column; gap: 6px; }

        label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #000000;
        }

        input, select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e8e8e8;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #111;
            background: #fff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none;
        }

        input:focus, select:focus {
            border-color: #0e0ea1;
            box-shadow: 0 0 0 3px rgba(14,14,161,0.08);
        }

        input::placeholder { color: #ccc; }

        /* select arrow */
        .select-wrap { position: relative; }
        .select-wrap::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 10px;
            color: #000000;
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* inline row */
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        /* ── Ações ── */
        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .btn-primary {
            flex: 1;
            padding: 12px;
            background: #0e0ea1;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:hover { background: #0b0b7a; transform: translateY(-1px); }

        .btn-secondary {
            padding: 12px 20px;
            background: #f5f5f5;
            color: #555;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-secondary:hover { background: #e8e8e8; }

        /* ── Footer ── */
        footer {
            border-top: 1px solid #e8e8e8;
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .footer-copy { font-size: 11px; color: #ccc; font-weight: 400; }
        .footer-stack { display: flex; gap: 10px; }
        .footer-stack span { font-size: 11px; color: #ccc; }
        .footer-stack span::before { content: '· '; }

        /* ── Animação ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body { padding: 32px 16px; }
            .header, .form-body, footer { padding-left: 20px; padding-right: 20px; }
            .row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="wrapper">

    <div class="header">
        <a class="back" href="/curso"><i class="fa-solid fa-arrow-left"></i> Cursos</a>
        <p class="page-eyebrow">Sistema Acadêmico</p>
        <h1 class="page-title">Novo Curso</h1>
        <p class="page-sub">Preencha os dados para cadastrar um novo curso.</p>
    </div>

    <hr class="divider">

    <form action="/curso/adicionar" method="post">
        <div class="form-body">

            <div class="field">
                <label for="nome"><i class="fa-solid fa-book"></i> Nome do Curso</label>
                <input type="text" id="nome" name="nome" placeholder="ex: Análise e Desenvolvimento de Sistemas" required>
            </div>

            <div class="field">
                <label for="site"><i class="fa-solid fa-globe"></i> Site</label>
                <input type="url" id="site" name="site" placeholder="https://www.exemplo.edu.br/curso">
            </div>

            <div class="row">
                <div class="field">
                    <label for="turno"><i class="fa-solid fa-clock"></i> Turno</label>
                    <div class="select-wrap">
                        <select id="turno" name="turno" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="noturno">Noturno</option>
                            <option value="diurno">Diurno</option>
                            <option value="vespertino">Vespertino</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="duracao"><i class="fa-solid fa-hourglass-half"></i> Duração (horas)</label>
                    <input type="number" id="duracao" name="duracao" placeholder="ex: 2000" min="1" required>
                </div>
            </div>

            <div class="form-actions">
                <a class="btn-secondary" href="/curso">
                    <i class="fa-solid fa-xmark"></i> Cancelar
                </a>
                <button class="btn-primary" type="submit">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Curso
                </button>
            </div>

        </div>
    </form>

    <footer>
        <span class="footer-copy">&copy; 2025</span>
        <div class="footer-stack">
            <span>Javalin 7</span>
            <span>Mustache</span>
            <span>PostgreSQL</span>
        </div>
    </footer>

</div>
</body>
</html>

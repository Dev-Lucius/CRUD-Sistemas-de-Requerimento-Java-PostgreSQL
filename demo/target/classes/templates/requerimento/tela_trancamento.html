<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Novo Requerimento de Trancamento</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
            padding: 50px;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #0056b3;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Solicitar Trancamento de Curso</h2>
        <form action="/requerimento/trancamento" method="POST">
            <div class="form-group">
                <label>Selecione o Aluno:</label>
                <select name="aluno_matricula" required>
                    {{#alunos}}
                    <option value="{{matricula}}">{{usuario.nome}} ({{matricula}})</option>
                    {{/alunos}}
                </select>
            </div>
            <div class="form-group">
                <label>Semestre Previsto de Retorno:</label>
                <input type="text" name="semestre_retorno" placeholder="Ex: 2027/1" required>
            </div>
            <button type="submit">Enviar Requerimento (Herança)</button>
        </form>
    </div>
</body>

</html>
